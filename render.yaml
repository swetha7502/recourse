databases:
  - name: recourse-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: recourse
    user: recourse

services:
  - type: web
    name: recourse
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recourse-db
          property: connectionString
      - key: INTENT_SIGNING_KEY
        generateValue: true
      - key: ENABLE_TEST_PAGE
        value: "false"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SEED_MERCHANT_EMAIL
        sync: false
      - key: SEED_BUYER_EMAIL
        sync: false
      - key: SEED_OPERATOR_EMAIL
        sync: false
      - key: SEED_VAULT_ID
        sync: false
      - key: SEED_VAULT_CUSTOMER_ID
        sync: false
